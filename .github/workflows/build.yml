# Validate on every pull request; build and deploy to GitHub Pages on merge to
# main and nightly. Action major versions and the landscape2 version are pinned;
# verify they are current before the first run.
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LANDSCAPE2_VERSION: v1.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install landscape2
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/cncf/landscape2/releases/download/${LANDSCAPE2_VERSION}/landscape2-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Validate
        run: |
          landscape2 validate data --data-file data.yml
          landscape2 validate settings --settings-file settings.yml
          landscape2 validate guide --guide-file guide.yml

      - name: Build
        env:
          GITHUB_TOKENS: ${{ secrets.LANDSCAPE_GITHUB_TOKENS }}
        run: |
          landscape2 build \
            --data-file data.yml \
            --settings-file settings.yml \
            --guide-file guide.yml \
            --logos-path logos \
            --output-dir build
          # Single-page app: unknown paths must serve the app.
          cp build/index.html build/404.html

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
