# Validate on every pull request; build and deploy to GitHub Pages on merge to
# main and nightly. Action major versions and the landscape2 version are pinned;
# verify they are current before the first run.
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LANDSCAPE2_VERSION: v1.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, so the site can show the date data.yml last changed.
          fetch-depth: 0

      - name: Install landscape2
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/cncf/landscape2/releases/download/${LANDSCAPE2_VERSION}/landscape2-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Validate
        run: |
          landscape2 validate data --data-file data.yml
          landscape2 validate settings --settings-file settings.yml
          landscape2 validate guide --guide-file guide.yml

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate name logos
        # Every entry's logo is its name at one shared type size. See
        # scripts/generate-name-logos.py.
        run: |
          python3 -m pip install --quiet "fonttools==4.66.1" "PyYAML==6.0.3"
          python3 scripts/generate-name-logos.py data.yml logos

      - name: Build
        env:
          GITHUB_TOKENS: ${{ secrets.LANDSCAPE_GITHUB_TOKENS }}
        run: |
          landscape2 build \
            --data-file data.yml \
            --settings-file settings.yml \
            --guide-file guide.yml \
            --logos-path logos \
            --output-dir build

      - name: Apply category colors
        run: python3 scripts/apply-category-colors.py build category-colors.json

      - name: Make the 16:9 slide
        # PNG and PDF of the whole map on one slide, published under
        # downloads/. See scripts/make-slide.py.
        run: |
          python3 -m pip install --quiet "playwright==1.63.0"
          python3 -m playwright install --with-deps chromium
          python3 scripts/make-slide.py data.yml logos category-colors.json build/downloads
          # The header download menu fetches docs/landscape.png and .pdf;
          # landscape2 does not create them, so serve the slide there.
          cp build/downloads/lebanon-ai-ecosystem-slide.png build/docs/landscape.png
          cp build/downloads/lebanon-ai-ecosystem-slide.pdf build/docs/landscape.pdf

      - name: Feedback page and menu item
        # feedback/index.html from data.yml and feedback.yml, then FEEDBACK
        # in the top menu in place of STATS. See scripts/make-feedback-page.py and
        # scripts/add-feedback-menu.py.
        run: |
          python3 scripts/make-feedback-page.py data.yml feedback.yml settings.yml build
          python3 scripts/add-feedback-menu.py build settings.yml

      - name: Design fixes
        # Introduction above the map, tile styling, item facts line, guide
        # width and empty-section notes, accessibility fixes. See
        # scripts/polish-site.py.
        run: python3 scripts/polish-site.py build data.yml guide.yml settings.yml

      - name: Visit counter
        # Cookie-free GoatCounter snippet; does nothing while counter.yml has
        # no site code. See scripts/add-counter.py.
        run: python3 scripts/add-counter.py build counter.yml

      - name: SPA fallback
        # Single-page app: unknown paths must serve the app.
        run: cp build/index.html build/404.html

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
