# Lebanon AI Ecosystem settings
#
# Hosted on GitHub Pages at https://lebanon-ai-ecosystem.github.io/landscape
# until a custom domain is set. When the custom domain goes live, change `url`
# to it and delete `base_path`.
#
# Reference: https://github.com/cncf/landscape2/blob/main/docs/config/settings.yml

foundation: Lebanon AI Ecosystem

url: https://lebanon-ai-ecosystem.github.io/landscape

base_path: /landscape

description: A neutral, open source map of the companies, research groups, and enablers building AI in Lebanon.

# Site colors. All seven are required whenever this section is present.
# color5 and color6 are the fallback category colors; per-category colors live
# in category-colors.json and are applied after the build.
colors:
  color1: "rgba(0, 122, 72, 1)"
  color2: "rgba(206, 17, 38, 1)"
  color3: "rgba(77, 160, 120, 1)"
  color4: "rgba(0, 51, 31, 0.7)"
  color5: "rgba(0, 122, 72, 1)"
  color6: "rgba(69, 90, 100, 1)"
  color7: "rgba(198, 232, 214, 1)"

grid_items_size: large

view_mode: grid

# Browser tab icon and link-preview image. landscape2 downloads these at build
# time, so they must be full URLs. They are pinned to the commit that added the
# files (stable even if main moves). To change either image, commit the new file
# first, then point these URLs at that commit.
images:
  favicon: "https://raw.githubusercontent.com/lebanon-ai-ecosystem/landscape/de29c5886a4b21438867837132187a57a0beee0d/assets/favicon.png"
  open_graph: "https://raw.githubusercontent.com/lebanon-ai-ecosystem/landscape/de29c5886a4b21438867837132187a57a0beee0d/assets/social-card.png"

header:
  links:
    github: "https://github.com/lebanon-ai-ecosystem/landscape"
  logo: "assets/header-logo.svg"

footer:
  links:
    github: "https://github.com/lebanon-ai-ecosystem/landscape"
  logo: "assets/footer-logo.svg"

groups:
  - name: "Full landscape"
    alias: all
    categories:
      - "Infrastructure and compute"
      - "Data"
      - "Models and core AI"
      - "Tools and platforms"
      - "Applied AI"
      - "Research and academia"
      - "Ecosystem enablers"
      - "Lebanese-founded abroad"
  - name: "Applied AI"
    alias: applied
    categories:
      - "Applied AI"
  - name: "Research and enablers"
    alias: ecosystem
    categories:
      - "Research and academia"
      - "Ecosystem enablers"
