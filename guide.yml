# Lebanon AI Ecosystem guide
#
# Category and subcategory names below match data.yml so the guide links to
# the live boxes. Use heading levels 4 to 6 inside content blocks.
#
# Reference: https://github.com/cncf/landscape2/blob/main/docs/config/guide.yml

categories:
  - category: "Introduction"
    content: |
      The Lebanon AI Ecosystem landscape maps the companies, research groups, and
      enablers building artificial intelligence in Lebanon, plus
      Lebanese-founded AI companies operating abroad.

      It is a neutral, open source community project. Inclusion follows
      published criteria and is free. Nobody pays for placement.

    subcategories:
      - subcategory: "How to read the map"
        content: |
          The map has five views. The full landscape shows every entry. The
          AI stack runs from infrastructure and data up through models and
          tools. Applied AI groups companies by the sector they serve.
          Research and enablers covers universities, labs, investors,
          accelerators, communities, and public bodies. Diaspora lists
          Lebanese-founded companies headquartered abroad.

          Each organization appears as its name, in the same font and size as
          every other. The map carries no logos, so no entry stands out
          because of its branding. Select a name for its details.

          For presentations, the whole map is available as one 16:9 slide,
          updated with every change:
          [PNG](https://lebanon-ai-ecosystem.github.io/landscape/downloads/lebanon-ai-ecosystem-slide.png) or
          [PDF](https://lebanon-ai-ecosystem.github.io/landscape/downloads/lebanon-ai-ecosystem-slide.pdf).

      - subcategory: "Who qualifies"
        content: |
          A company qualifies when AI is the product, not one feature of a
          product, customers can use it today, and the company is
          headquartered in Lebanon or runs a working team there. Acquired
          companies qualify on the same terms. Open-source AI projects
          created by Lebanese people qualify wherever their creators live.
          The full criteria live in CONTRIBUTING.md in the project
          repository.

      - subcategory: "How to get listed or corrected"
        content: |
          Open a pull request or an issue in the project repository on
          GitHub: https://github.com/lebanon-ai-ecosystem/landscape.
          Maintainers answer correction and removal requests within 7 days.

