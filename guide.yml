# Lebanon AI Ecosystem guide
#
# Category and subcategory names below match data.yml so the guide links to
# the live boxes. Use heading levels 4 to 6 inside content blocks.
#
# Reference: https://github.com/cncf/landscape2/blob/main/docs/config/guide.yml

categories:
  - category: "Introduction"
    content: |
      The Lebanon AI Ecosystem landscape maps the companies, research groups, and
      enablers building artificial intelligence in Lebanon, plus
      Lebanese-founded AI companies operating abroad.

      It is a neutral, open source community project. Inclusion follows
      published criteria and is free. Nobody pays for placement.

    subcategories:
      - subcategory: "How to read the map"
        content: |
          The full landscape shows every entry. Applied AI groups companies by
          the sector they serve. Research and enablers covers universities,
          labs, investors, accelerators, communities, and public bodies. Views
          for the AI stack and for diaspora companies open once they have
          entries.

          Each organization appears as its name, in the same font and size as
          every other. The map carries no logos, so no entry stands out
          because of its branding. Select a name for its details.

      - subcategory: "Who qualifies"
        content: |
          A company qualifies when AI is core to a live product or service
          customers can use today, and it is headquartered in Lebanon or runs
          a working team there. The full criteria live in CONTRIBUTING.md in
          the project repository.

      - subcategory: "How to get listed or corrected"
        content: |
          Open a pull request, use the GitHub issue form, or use the web form
          linked in the header. Maintainers answer correction and removal
          requests within 7 days.

