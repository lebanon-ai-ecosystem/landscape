# Lebanon AI Ecosystem guide
#
# Category and subcategory names below match data.yml so the guide links to
# the live boxes. Use heading levels 4 to 6 inside content blocks.
#
# Write each box description so it stays true as entries change: say what
# belongs and what does not, and do not name individual entries.
#
# Reference: https://github.com/cncf/landscape2/blob/main/docs/config/guide.yml

categories:
  - category: "Introduction"
    content: |
      The Lebanon AI Ecosystem landscape maps the organizations building
      artificial intelligence in Lebanon: companies whose product is AI,
      universities and research labs, investors, accelerators, communities,
      and public bodies. It also maps AI companies founded by Lebanese
      people and headquartered abroad.

      It is for anyone who needs a clear picture of who does what: founders
      looking for partners or customers, investors, researchers, students,
      journalists, and policymakers.

      It is a neutral, open source community project. Listing is free and
      follows published rules. Nobody pays for placement, and the same rules
      apply to every organization, including those the maintainers work for.

    subcategories:
      - subcategory: "How to read the map"
        content: |
          The map has five views, selected at the top of the Explore page:

          - **Full landscape** shows every entry.
          - **AI stack** runs from infrastructure and data up through models
            and tools.
          - **Applied AI** groups companies by the sector they serve.
          - **Research and enablers** covers universities, labs, investors,
            accelerators, communities, and public bodies.
          - **Diaspora** lists AI companies founded by Lebanese people and
            headquartered abroad.

          Each organization appears as its name, in the same font and size as
          every other. The map carries no logos, so no entry stands out
          because of its branding. Select a name for its description and
          website.

          A box appears on the map only once it has at least one entry. This
          guide describes every box, including those still empty.

      - subcategory: "Who qualifies"
        content: |
          #### Companies

          A company qualifies when its product is AI software, not software
          that uses AI, and customers can use it today. It must be headquartered in
          Lebanon or run a working team there of at least three full-time
          people. Acquired companies qualify on the same terms while the
          product stays live.

          #### Diaspora companies

          The same product bar applies. At least one founder or co-founder is
          Lebanese, and the company is headquartered abroad.

          #### Open-source projects

          Open-source AI projects created by Lebanese people qualify, wherever
          their creators live. They sit in the box that matches what they do.

          #### Research, enablers, and public bodies

          - **Universities and labs:** AI research output in the last 24
            months.
          - **Investors:** at least one investment in a qualifying AI company.
          - **Accelerators and incubators:** at least one AI company in a
            cohort in the last 24 months.
          - **Communities and nonprofits:** AI events or programs in the last
            12 months.
          - **Government bodies:** a formal AI mandate or program.

          #### Out of scope

          Consultancies, agencies, and software houses that build AI for
          clients without a product of their own; resellers of foreign AI
          tools; companies in stealth; and organizations with no visible
          activity in the last 12 months. For open-source models, current
          use, shown by downloads in the last 12 months, counts as activity:
          published models are rarely modified, and improvements ship as new
          versions.

          The full criteria, with the evidence required for each type, are in
          [CONTRIBUTING.md](https://github.com/lebanon-ai-ecosystem/landscape/blob/main/CONTRIBUTING.md).

      - subcategory: "Listing rules"
        content: |
          An organization is listed only when all three hold:

          1. **The evidence is strong.** Maintainers rate every candidate high,
             medium, or low confidence from public sources. Only high and
             medium candidates are listed. Medium means one criterion still
             needs checking; maintainers follow up with the organization.
          2. **A working website is confirmed.** A maintainer opens the
             homepage before any entry is added.
          3. **The product is AI software.** Models, AI platforms, and AI
             applications whose core is the AI itself qualify. Software,
             services, and devices that use or integrate AI do not, however
             good the AI, and neither do marketplaces where third-party AI
             does the work.

          Listing does not require the organization's consent, and it is not
          an endorsement. It records that an organization meets the published
          criteria, based on public information.

      - subcategory: "How to get listed or corrected"
        content: |
          There are two ways, both on GitHub. Each needs a free GitHub
          account.

          1. **Issue:** fill in the
             [Add or update an entry](https://github.com/lebanon-ai-ecosystem/landscape/issues/new?template=add-entry.yml)
             form. For a new entry, a maintainer's approval drafts the change
             automatically.
          2. **Pull request:** edit `data.yml` in the
             [repository](https://github.com/lebanon-ai-ecosystem/landscape)
             and open a pull request.

          Corrections and removal requests use the same two routes.
          Maintainers answer them within 7 days. Every change is reviewed and
          recorded publicly.

      - subcategory: "Governance"
        content: |
          The project is run by volunteer maintainers acting in a personal
          capacity. They are listed, with their affiliations, in
          [MAINTAINERS.md](https://github.com/lebanon-ai-ecosystem/landscape/blob/main/MAINTAINERS.md).

          A maintainer never approves changes to an entry for an organization
          they work for, advise, or invest in. Every website on the map is
          checked automatically each week, and broken ones are reported for
          review.

          The project follows the Contributor Covenant code of conduct. To
          raise a concern, open a
          [Conduct concern](https://github.com/lebanon-ai-ecosystem/landscape/issues/new?template=conduct.yml)
          issue without any details; a maintainer contacts you privately
          within 3 days.

      - subcategory: "Downloads and reuse"
        content: |
          The download menu at the top of every page offers the map as an
          image (PNG) or a document (PDF), and the data as CSV files. The
          image and document are one 16:9 slide, ready for presentations and
          updated with every change.

          The data and the map are licensed under
          [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/): reuse
          them freely with credit to the Lebanon AI Ecosystem project. The
          code is licensed under Apache 2.0.

  - category: "Infrastructure and compute"
    content: |
      The base of the AI stack: the computing power, hosting, and tooling
      that AI systems run on. Public sources show few Lebanon-based
      companies with their own product at this layer so far. Lebanese-founded
      companies working at this layer abroad appear under Diaspora: AI stack.

    subcategories:
      - subcategory: "Cloud, hosting and compute"
        content: |
          Companies that provide the computing capacity AI needs: GPU and
          cloud services, data centers, and hosting built for training or
          running models. Resellers of foreign cloud services without a
          product of their own do not qualify.

      - subcategory: "MLOps and model deployment"
        content: |
          Products that take models from development into production and keep
          them working: training pipelines, deployment, serving, monitoring,
          and evaluation.

  - category: "Data"
    content: |
      The data layer: products that collect, prepare, label, and analyze the
      data AI systems learn from and work with. Data services sold as
      projects to clients, without a product of their own, do not qualify.

    subcategories:
      - subcategory: "Data platforms and engineering"
        content: |
          Products for storing, moving, and preparing data for AI: data
          platforms, pipelines, vector databases, and synthetic data tools.

      - subcategory: "Data labeling and annotation"
        content: |
          Products and platforms for labeling text, speech, images, and video
          to train and evaluate AI models, including Arabic and dialect data.

      - subcategory: "Analytics and BI"
        content: |
          Analytics and business intelligence products where AI produces the
          insight itself: forecasting, anomaly detection, or answers to
          questions about data. Dashboards with an added AI feature do not
          qualify.

  - category: "Models and core AI"
    content: |
      Organizations that build AI models and core capabilities rather than
      applications. Arabic language and speech has its own box, given the
      particular needs of Arabic and its spoken dialects.

    subcategories:
      - subcategory: "Foundation and language models"
        content: |
          Organizations that train or substantially adapt their own large
          models, including language, multimodal, and world models. Products
          that only call another company's model belong in the box for what
          they do.

      - subcategory: "Arabic NLP and speech"
        content: |
          Products whose core is understanding or generating Arabic: text
          analysis, translation, speech recognition, and speech synthesis,
          including Lebanese and other spoken dialects.

      - subcategory: "Computer vision"
        content: |
          Products whose core is understanding images and video: recognition,
          inspection, document reading, and visual search.

  - category: "Tools and platforms"
    content: |
      Products that let other teams build with AI: agent platforms,
      conversational AI, and developer tools. Products where an AI chatbot or
      assistant is one feature of a wider platform do not qualify.

    subcategories:
      - subcategory: "Agents and automation"
        content: |
          Platforms for building or running AI agents that plan and complete
          tasks across tools and systems.

      - subcategory: "Conversational AI"
        content: |
          Products whose core is AI conversation: assistants and chatbots for
          customer service, sales, or support, sold as the product itself.

      - subcategory: "Developer tools"
        content: |
          Tools for people building AI software: AI coding assistants, model
          and prompt testing, APIs, and SDKs.

  - category: "Applied AI"
    content: |
      Companies that apply AI to a specific sector, grouped by the sector
      they serve. Most Lebanese AI companies found so far work here. Each company
      sits in one box, chosen by what its product does rather than who buys
      it.

    subcategories:
      - subcategory: "Fintech and banking"
        content: |
          AI products for banking, payments, credit, insurance, and
          investment, where AI makes the core decision or delivers the core
          service.

      - subcategory: "Health and life sciences"
        content: |
          AI products for diagnosis, clinical work, drug discovery, and health
          monitoring.

      - subcategory: "Education"
        content: |
          AI products for learning and teaching: tutors, adaptive learning,
          assessment, and AI-led courses.

      - subcategory: "Retail and e-commerce"
        content: |
          AI products for retail and online commerce: personalization,
          demand forecasting, pricing, and visual search.

      - subcategory: "Media, marketing and adtech"
        content: |
          AI products for content, media, and advertising: content
          generation, audience analytics, and ad targeting.

      - subcategory: "Energy, climate and agriculture"
        content: |
          AI products for energy systems, climate, and farming: solar and grid
          management, emissions tracking, and precision agriculture.

      - subcategory: "Legal and compliance"
        content: |
          AI products for legal work and regulatory compliance: drafting,
          review, legal research, and compliance checks.

      - subcategory: "Logistics and mobility"
        content: |
          AI products for transport and supply chains: routing, fleet
          optimization, demand planning, and autonomous systems.

      - subcategory: "HR and future of work"
        content: |
          AI products for hiring and work: candidate matching, skills
          assessment, and workforce planning.

      - subcategory: "Cybersecurity"
        content: |
          Security products whose core is AI: threat detection, fraud
          prevention, and automated response.

  - category: "Research and academia"
    content: |
      Universities and research centers producing AI research, training AI
      talent, or running AI programs. Each university and each named lab or
      center is a separate entry, so a lab appears alongside its university.

    subcategories:
      - subcategory: "Universities"
        content: |
          Universities in Lebanon with AI research output in the last 24
          months: publications, funded projects, or released code.

      - subcategory: "Research centers and labs"
        content: |
          Named AI labs, centers, and institutes, inside a university or
          independent, with research output in the last 24 months.

  - category: "Ecosystem enablers"
    content: |
      The organizations that fund, support, connect, and govern AI work in
      Lebanon, without building AI products themselves.

    subcategories:
      - subcategory: "Investors"
        content: |
          Venture funds, angel networks, and other investors with at least one
          investment in a qualifying AI company, in Lebanon or founded by
          Lebanese people abroad.

      - subcategory: "Accelerators and incubators"
        content: |
          Programs and hubs that have supported at least one AI company in a
          cohort in the last 24 months.

      - subcategory: "Communities and nonprofits"
        content: |
          Communities, nonprofits, and networks that held AI events or
          programs in the last 12 months, including diaspora networks.

      - subcategory: "Government and public bodies"
        content: |
          Ministries and public bodies with a formal AI mandate, strategy, or
          program.

  - category: "Lebanese-founded abroad"
    content: |
      AI companies founded or co-founded by Lebanese people and headquartered
      outside Lebanon. They meet the same product bar as companies in
      Lebanon. A diaspora company with a working team in Lebanon of at least
      three full-time people is listed as a Lebanese company instead.

    subcategories:
      - subcategory: "Diaspora: AI stack"
        content: |
          Diaspora companies building at the AI stack layers: infrastructure,
          data, models, and tools for building with AI.

      - subcategory: "Diaspora: applied AI"
        content: |
          Diaspora companies applying AI to a specific sector, such as health,
          hiring, or industry.
