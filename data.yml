# Lebanon AI Ecosystem landscape data
#
# One entry per organization, in its primary subcategory. Use `second_path`
# to show an entry in a second subcategory without duplicating it.
#
# `twitter` (the X account) and `extra.linkedin_url`: only accounts the
# organization itself links from its own website. Never a person's profile and
# never a parent organization's account. Leave them out when the site links
# none. They show as icons on the entry's detail view.
#
# `second_path` (at most one): only when the entry does both things as a core
# activity, for example an accelerator that also runs a fund. Never use it to
# place a Lebanese-founded-abroad entry in a Lebanon section.
#
# Every entry carries `extra.annotations` with the fields below. city, founded
# and verified_on are shown on the entry's detail view (scripts/polish-site.py);
# the rest are kept for curation and stats.
#
#   presence:     hq | team | diaspora | abroad | unconfirmed
#                 (abroad: a community or group based outside Lebanon)
#   city:         city of the Lebanon office (or the abroad HQ for diaspora)
#   founded:      year, as a string
#   verified_by:  entity | public-sources | pending
#   verified_on:  YYYY-MM-DD
#   confidence:   high | medium (seed research rating; medium means one
#                 inclusion criterion still needs checking)
#
# `logo` is a file name only (lowercase name with hyphens, .svg). The image is
# generated from `name` by scripts/generate-name-logos.py; there are no
# organization logos in this landscape.
#
# Reference: https://github.com/cncf/landscape2/blob/main/docs/config/data.yml

