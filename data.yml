# Lebanon AI Ecosystem landscape data
#
# One entry per organization, in its primary subcategory. Use `second_path`
# to show an entry in a second subcategory without duplicating it.
#
# Every entry carries `extra.annotations` with the fields below. Annotations
# are not shown on the site; they keep the data we need for curation and stats.
#
#   presence:     hq | team | diaspora
#   city:         city of the Lebanon office (or the abroad HQ for diaspora)
#   founded:      year, as a string
#   verified_by:  entity | public-sources | pending
#   verified_on:  YYYY-MM-DD
#
# `logo` is a file name only (lowercase name with hyphens, .svg). The image is
# generated from `name` by scripts/generate-name-logos.py; there are no
# organization logos in this landscape.
#
# Reference: https://github.com/cncf/landscape2/blob/main/docs/config/data.yml

